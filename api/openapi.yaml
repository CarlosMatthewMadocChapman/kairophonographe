openapi: 3.1.0
info:
  title: Kairophonographe Reference API
  version: 0.6.0
  description: Public reference interface for reading mappings and translating a normalized session into a deterministic music specification.
paths:
  /health:
    get:
      responses:
        '200': {description: Healthy}
  /v1/manifest:
    get:
      responses:
        '200': {description: Canon manifest}
  /v1/mappings/{name}:
    get:
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
      responses:
        '200': {description: Mapping document}
        '404': {description: Unknown mapping}
  /v1/translate:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/session.schema.json
      responses:
        '200': {description: Deterministic music specification}
        '422': {description: Invalid session}
